name: Add elevator guide safely

on:
  push:
    branches:
      - elevator-guide-20261004

permissions:
  contents: write

jobs:
  elevator-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elevator-guide-20261004
      - name: Apply elevator guide edit
        run: python .github/scripts/add_elevator_guide.py
      - name: Commit result
        run: |
          rm -f .github/workflows/add-elevator-guide-20261004.yml .github/scripts/add_elevator_guide.py
          git config user.name "naosukenavi"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add elevator quick and detailed guide"
          git push origin HEAD:elevator-guide-20261004
