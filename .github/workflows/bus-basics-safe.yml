name: Bus basics safe edit

on:
  push:
    branches:
      - bus-basics-20261004

permissions:
  contents: write

jobs:
  busbasics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bus-basics-20261004

      - name: Add bus basics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '    <div id="frontPanel" class="front-panel" aria-live="polite"></div>\n    <div class="walking-entry">'
          if marker not in s:
              raise SystemExit('target marker not found')
          section = '''    <div id="frontPanel" class="front-panel" aria-live="polite"></div>
    <div class="step-card bus-basics-card">
      <div class="step-label">🚌 BUS</div>
      <h3 data-ja="新神戸・三宮周辺の路線バスの基本" data-en="Basic local bus rules around Shin-Kobe / Sannomiya">新神戸・三宮周辺の路線バスの基本</h3>
      <div class="point">
        <ul>
          <li data-ja="後ろの扉から乗る" data-en="Board from the rear door">後ろの扉から乗る</li>
          <li data-ja="前の扉から降りる" data-en="Exit from the front door">前の扉から降りる</li>
          <li data-ja="ICカードは乗る時・降りる時の2回タッチ" data-en="Tap your IC card twice: when boarding and when getting off">ICカードは乗る時・降りる時の2回タッチ</li>
          <li data-ja="三宮周辺は230円区間が多い" data-en="Many trips around Sannomiya cost ¥230">三宮周辺は230円区間が多い</li>
          <li data-ja="運賃は降りる時に支払う" data-en="Pay the fare when getting off">運賃は降りる時に支払う</li>
        </ul>
      </div>
      <div class="warning">
        <strong data-ja="※ 一部の路線では、乗り方・料金が異なります。" data-en="Note: Boarding methods and fares may differ on some routes.">※ 一部の路線では、乗り方・料金が異なります。</strong>
      </div>
    </div>
    <div class="walking-entry">'''
          p.write_text(s.replace(marker, section, 1), encoding='utf-8')
          PY

      - name: Commit result
        run: |
          rm -f .github/workflows/add-bus-basics-20261004.yml .github/workflows/bus-basics-safe.yml
          git config user.name "naosukenavi"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add local bus basics guide"
          git push origin HEAD:bus-basics-20261004
