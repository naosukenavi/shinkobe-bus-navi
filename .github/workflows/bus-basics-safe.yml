name: Bus basics safe edit

on:
  push:
    branches:
      - bus-basics-20261004

permissions:
  contents: write

jobs:
  busbasics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bus-basics-20261004

      - name: Add bus basics
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '    <div id="frontPanel" class="front-panel" aria-live="polite"></div>\n    <div class="walking-entry">'
          if marker not in s:
              raise SystemExit('target marker not found')
          b64 = ''
          section = base64.b64decode(b64).decode('utf-8')
          p.write_text(s.replace(marker, section, 1), encoding='utf-8')
          PY

      - name: Commit result
        run: |
          rm -f .github/workflows/add-bus-basics-20261004.yml .github/workflows/bus-basics-safe.yml
          git config user.name "naosukenavi"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add local bus basics guide"
          git push origin HEAD:bus-basics-20261004
