name: Fix elevator PNG path

on:
  push:
    branches:
      - elevator-png-fix-20261004

permissions:
  contents: write

jobs:
  fix-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elevator-png-fix-20261004

      - name: Fix elevator image path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/elevator_guide.webp'
          new = 'assets/elevator_guide.png'
          if old not in s:
              raise SystemExit('old path not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit result
        run: |
          rm -f .github/workflows/fix-elevator-png-20261004.yml
          git config user.name "naosukenavi"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix elevator guide PNG path"
          git push origin HEAD:elevator-png-fix-20261004
