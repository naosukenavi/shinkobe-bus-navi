name: Fix detailed guide button

on:
  push:
    paths:
      - '.github/workflows/fix-show-encyclopedia-20261005.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore showEncyclopedia function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'function showEncyclopedia(type)' in s:
              raise SystemExit('showEncyclopedia already exists')
          anchor='function frontB(){'
          addition="function showEncyclopedia(type){\n  const defaults={west:'ポートループ',middle:'神戸空港',east:'神戸空港',tunnel:'有馬温泉',hotel:'徳島'};\n  if(defaults[type] && data[defaults[type]]) current=defaults[type];\n  document.getElementById('frontGuide').style.display='none';\n  document.getElementById('stopListPage').classList.remove('show');\n  const layout=document.getElementById('mainLayout');\n  layout.style.display='grid';\n  renderDest();\n  renderDetail();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n"
          if anchor not in s:
              raise SystemExit('insert anchor not found')
          s=s.replace(anchor,addition+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix detailed guide navigation"
          git push
