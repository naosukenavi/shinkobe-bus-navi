name: Point west detailed guide to current Port Loop

on:
  push:
    paths:
      - '.github/workflows/fix-show-encyclopedia-20261005.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point current west guide button to current Port Loop panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="onclick=\"showEncyclopedia(\\'west\\')\""
          new="onclick=\"frontPortLoop()\""
          if old not in s:
              raise SystemExit('west detailed-guide button target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open current Port Loop guide from west button"
          git push
