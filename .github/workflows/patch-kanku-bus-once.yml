name: Patch Kansai Airport limousine image once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-kanku-bus-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''        <div class="point pink" style="margin-top:12px">
          <strong>🕒 ${t('発車時刻','Departure times')}</strong>
          <div><strong>11:00／14:20</strong></div>
          <div>${t('1日2便（2026年9月現在）','2 services per day (as of September 2026)')}</div>
        </div>
      </div>'''
          new = '''        <div class="point pink" style="margin-top:12px">
          <strong>🕒 ${t('発車時刻','Departure times')}</strong>
          <div><strong>11:00／14:20</strong></div>
          <div>${t('1日2便（2026年9月現在）','2 services per day (as of September 2026)')}</div>
        </div>
        <figure class="photo guide-shot" style="margin-top:12px">
          <img src="assets/kanku_limousine_bus.png" alt="${t('関空リムジン車体','Kansai Airport limousine bus vehicle')}">
          <figcaption>${t('関空リムジン車体','Kansai Airport limousine bus vehicle')}</figcaption>
        </figure>
      </div>'''
          if old not in s:
              raise SystemExit('Target block not found; aborting without changes')
          s2 = s.replace(old, new, 1)
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Kansai Airport limousine vehicle image'
          git push
