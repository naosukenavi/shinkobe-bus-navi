name: Patch Kansai limousine bus image once

on:
  push:
    paths:
      - '.github/workflows/patch-kanku-bus-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry one-time Kansai limousine image patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Kansai limousine bus image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '          <div><strong>11:00／14:20</strong></div>'
          if marker not in s:
              raise SystemExit('Kansai departure time marker not found')
          start = s.index(marker)
          target = '        </div>\n      </div>'
          pos = s.index(target, start)
          insert = '''        </div>
        <figure class="photo guide-shot" style="margin-top:12px">
          <img src="assets/kanku_limousine_bus.png" alt="関空リムジン車体 / Kansai Airport limousine bus vehicle">
          <figcaption>関空リムジン車体 / Kansai Airport limousine bus vehicle</figcaption>
        </figure>
      </div>'''
          s = s[:pos] + insert + s[pos+len(target):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Kansai Airport limousine vehicle image"
          git push
