name: Patch Kansai STEP4 once

on:
  push:
    paths:
      - '.github/workflows/patch-kanku-step4-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch STEP4
        run: python .github/patch_kanku_step4.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Kansai Airport info to STEP4"
          git push
