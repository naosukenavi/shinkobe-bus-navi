name: Patch Kansai Airport hotel stop

on:
  push:
    paths:
      - '.github/workflows/patch-kansai-hotel.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Kansai Airport hotel stop patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Kansai Airport hotel stop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_line = "        <p>${t('徳島方面・関西空港方面などのバスは、こちらの乗り場です。','Buses for Tokushima and Kansai Airport use this boarding area.')}</p>"
          new_line = old_line + "\n        <div class=\"point pink\" style=\"margin-bottom:14px\">\n          <strong>🔴 ${t('関西空港（関空リムジン）','Kansai International Airport (Airport Limousine)')}</strong>\n          <div>${t('4階ホテル玄関前発着','Departs from the 4F Hotel Entrance')}</div>\n        </div>"
          if old_line not in s:
              raise SystemExit('Kansai Airport hotel stop target not found')
          s = s.replace(old_line, new_line, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show Kansai Airport Limousine at hotel entrance"
          git push