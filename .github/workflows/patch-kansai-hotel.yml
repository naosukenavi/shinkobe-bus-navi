name: Patch Kansai Airport hotel stop

on:
  push:
    paths:
      - '.github/workflows/patch-kansai-hotel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""        <p>${t('徳島方面・関西空港方面などのバスは、こちらの乗り場です。','Buses for Tokushima and Kansai Airport use this boarding area.')}</p>
        <div class=\"front-actions\">"""
          new="""        <p>${t('徳島方面・関西空港方面などのバスは、こちらの乗り場です。','Buses for Tokushima and Kansai Airport use this boarding area.')}</p>
        <div class=\"point pink\" style=\"margin-bottom:14px\">
          <strong>🔴 ${t('関西空港（関空リムジン）','Kansai International Airport (Airport Limousine)')}</strong>
          <div>${t('4階ホテル玄関前発着','Departs from the 4F Hotel Entrance')}</div>
        </div>
        <div class=\"front-actions\">"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show Kansai Airport Limousine at hotel entrance"
          git push
