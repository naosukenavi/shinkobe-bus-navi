name: Reorder front guide safely

on:
  push:
    branches:
      - front-layout-20261004

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: front-layout-20261004
      - name: Apply front layout change
        run: python tools/reorder_front.py
      - name: Commit result
        run: |
          rm -f .github/workflows/reorder-front-20261004.yml tools/reorder_front.py
          git config user.name "naosukenavi"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reorder front guide buttons and current-location section"
          git push origin HEAD:front-layout-20261004
