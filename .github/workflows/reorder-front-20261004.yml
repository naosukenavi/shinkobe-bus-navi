name: Reorder front guide safely

on:
  push:
    branches:
      - front-layout-20261004

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: front-layout-20261004

      - name: Reorder front guide
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('  <section class="front-guide" id="frontGuide">')
          end = s.index('  <div class="layout" id="mainLayout"', start)
          new = '''  <section class="front-guide" id="frontGuide">
    <div class="front-title">
      <h2 data-ja="新神戸駅 バス案内　最重要事項" data-en="Shin-Kobe Station Bus Guide — Important Information">新神戸駅 バス案内　最重要事項</h2>
    </div>
    <p class="front-intro front-first-note" data-ja="まず知っておいてください" data-en="Please know this first.">まず知っておいてください</p>
    <p class="front-intro">
      <strong data-ja="新神戸駅は六甲山の山裾にあり、駅周辺は高低差があります。" data-en="Shin-Kobe Station is at the foot of Mt. Rokko, and there are differences in elevation around the station.">新神戸駅は六甲山の山裾にあり、駅周辺は高低差があります。</strong><br>
      <span data-ja="狭い土地に造られているため、バスのりばは3か所に分散しています。" data-en="Because the station is built on a narrow site, the bus boarding areas are divided among three locations.">狭い土地に造られているため、バスのりばは3か所に分散しています。</span>
    </p>
    <div class="simple-guide-card station-overview-card">
      <img id="stationOverviewImg" src="assets/shinkobe_bus_locations.png" alt="新神戸駅の高低差と3か所のバス乗り場">
    </div>
    <div class="step-card">
      <h3 data-ja="のりば から探す。" data-en="Find by boarding area">のりば から探す。</h3>
      <div class="front-actions">
        <button class="front-action yellow" onclick="frontLocation('hotel')" data-ja="🏨 ホテル玄関前" data-en="🏨 Hotel Entrance">🏨 ホテル玄関前</button>
        <button class="front-action green" onclick="frontLocation('tunnel')" data-ja="🟢 トンネル入口" data-en="🟢 Tunnel Entrance">🟢 トンネル入口</button>
        <button class="front-action" onclick="frontRotary()" data-ja="🚌 ロータリー" data-en="🚌 Rotary">🚌 ロータリー</button>
      </div>
    </div>
    <p class="front-intro">
      <span data-ja="バスのりばは西端と東端で" data-en="The west and east ends of the bus boarding areas are ">バスのりばは西端と東端で</span><strong data-ja="100メートル以上" data-en="more than 100 meters">100メートル以上</strong><span data-ja="離れています。" data-en=" apart.">離れています。</span><br>
      <span data-ja="また、" data-en="There is also a ">また、</span><strong data-ja="地階から4階まで高低差があり、利用するエレベーターも異なります。" data-en="vertical difference from the basement level to the 4th floor, and the elevators used are different.">地階から4階まで高低差があり、利用するエレベーターも異なります。</strong><br>
      <strong data-ja="目的地によって、移動する方向や階が変わります。" data-en="The direction and floor you need to use depend on your destination.">目的地によって、移動する方向や階が変わります。</strong>
    </p>
    <div class="step-card">
      <div class="step-label">STEP 1</div>
      <h3 data-ja="今いる場所を確認する" data-en="Confirm your current location">今いる場所を確認する</h3>
      <p data-ja="現在地に近い場所を選んでください。" data-en="Choose the location closest to where you are now.">現在地に近い場所を選んでください。</p>
      <div class="location-grid">
        <button class="location-btn" onclick="frontWhere('rotary')" data-ja="🚌 1階ロータリー" data-en="🚌 1F bus rotary">🚌 1階ロータリー</button>
        <button class="location-btn" onclick="frontWhere('shinkansen')" data-ja="🚄 2階新幹線改札口" data-en="🚄 2F Shinkansen ticket gates">🚄 2階新幹線改札口</button>
        <button class="location-btn" onclick="frontWhere('subway')" data-ja="🚇 地下鉄新神戸駅改札口付近" data-en="🚇 Near Subway Shin-Kobe Station ticket gates">🚇 地下鉄新神戸駅改札口付近</button>
      </div>
      <button class="lost-btn" onclick="frontLost()" data-ja="📍 どれもわからない" data-en="📍 I don't recognize any of these">📍 どれもわからない</button>
    </div>
    <div id="frontPanel" class="front-panel" aria-live="polite"></div>
    <div class="walking-entry">
      <button class="walking-entry-btn" onclick="toggleWalkingEntry()" data-ja="🚶 徒歩ルート" data-en="🚶 Walking routes">🚶 徒歩ルート</button>
      <div id="walkingEntryPanel" class="walking-entry-panel" aria-live="polite">
        <div class="walking-route-list">
          <button class="walking-route-btn" onclick="selectWalkingRoute('waterfall')" data-ja="1. 布引の滝" data-en="1. Nunobiki Falls">1. 布引の滝</button>
          <button class="walking-route-btn" onclick="selectWalkingRoute('dougukan')" data-ja="2. 竹中大工道具館" data-en="2. Takenaka Carpentry Tools Museum">2. 竹中大工道具館</button>
          <button class="walking-route-btn" onclick="selectWalkingRoute('bus218')" data-ja="3. 2系統・18系統「布引」バス停" data-en="3. Route 2 / 18 “Nunobiki” bus stop">3. 2系統・18系統「布引」バス停</button>
          <button class="walking-route-btn" onclick="selectWalkingRoute('bus92')" data-ja="4. 92系統「布引」バス停" data-en="4. Route 92 “Nunobiki” bus stop">4. 92系統「布引」バス停</button>
          <button class="walking-route-btn" onclick="selectWalkingRoute('kitanoSannomiya')" data-ja="5. 北野・三宮方面" data-en="5. Kitano / Sannomiya area">5. 北野・三宮方面</button>
        </div>
        <div id="walkingRouteDetail" class="walking-route-detail" aria-live="polite"></div>
      </div>
    </div>
    <div class="walking-entry rail-entry">
      <button class="walking-entry-btn" onclick="toggleRailEntry()" data-ja="🚉 電車・鉄道連絡" data-en="🚉 Rail connections">🚉 電車・鉄道連絡</button>
      <div id="railEntryPanel" class="walking-entry-panel" aria-live="polite">
        <div class="walking-route-list">
          <button class="walking-route-btn" onclick="selectRailRoute('subway')" data-ja="1. 地下鉄（新神戸駅～三宮駅）" data-en="1. Subway (Shin-Kobe–Sannomiya)">1. 地下鉄（新神戸駅～三宮駅）</button>
          <button class="walking-route-btn" onclick="selectRailRoute('hankyu')" data-ja="2. 阪急 神戸三宮駅へ乗り継ぐ" data-en="2. Transfer to Hankyu Kobe-Sannomiya Station">2. 阪急 神戸三宮駅へ乗り継ぐ</button>
          <button class="walking-route-btn" onclick="selectRailRoute('hanshin')" data-ja="3. 阪神 神戸三宮駅へ乗り継ぐ" data-en="3. Transfer to Hanshin Kobe-Sannomiya Station">3. 阪神 神戸三宮駅へ乗り継ぐ</button>
          <button class="walking-route-btn" onclick="selectRailRoute('arimaRail')" data-ja="4. 有馬温泉へ地下鉄・神鉄で行く" data-en="4. To Arima Onsen by Subway and Kobe Electric Railway">4. 有馬温泉へ地下鉄・神鉄で行く</button>
          <button class="walking-route-btn" onclick="selectRailRoute('airportRail')" data-ja="5. 神戸空港へ地下鉄・ポートライナーで行く" data-en="5. To Kobe Airport by Subway and Port Liner">5. 神戸空港へ地下鉄・ポートライナーで行く</button>
          <button class="walking-route-btn" onclick="selectRailRoute('rokkoRail')" data-ja="6. 六甲アイランドへ鉄道で行く" data-en="6. To Rokko Island by Rail">6. 六甲アイランドへ鉄道で行く</button>
        </div>
        <div id="railRouteDetail" class="walking-route-detail" aria-live="polite"></div>
      </div>
    </div>
    <div class="walking-entry ropeway-entry">
      <button class="walking-entry-btn" onclick="toggleRopewayEntry()" data-ja="🚡 ロープウェイ・観光" data-en="🚡 Ropeway & sightseeing">🚡 ロープウェイ・観光</button>
      <div id="ropewayEntryPanel" class="walking-entry-panel" aria-live="polite">
        <div class="walking-route-list">
          <button class="walking-route-btn" onclick="selectRopewayRoute()" data-ja="布引ハーブ園・ロープウェイ" data-en="Nunobiki Herb Gardens / Ropeway">🚡 布引ハーブ園・ロープウェイ</button>
        </div>
        <div id="ropewayRouteDetail" class="walking-route-detail" aria-live="polite"></div>
      </div>
    </div>
  </section>
'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY

      - name: Commit result
        run: |
          rm -f .github/workflows/reorder-front-20261004.yml
          git config user.name "naosukenavi"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reorder front guide buttons and current-location section"
          git push origin HEAD:front-layout-20261004
